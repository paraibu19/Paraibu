<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paraibu - Pediatric Dose Calculator</title>
    <meta name="theme-color" content="#4dabf7" />
    <meta name="description" content="Professional pediatric medication dose calculation assistant" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-title" content="Paraibu" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Proactive self-healing recovery: Unregister legacy/stale Service Workers, clear caches, and reload
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations && registrations.length > 0) {
            console.log('Stale service workers detected (' + registrations.length + '). Purging to download fresh application resources...');
            var promises = [];
            for (var i = 0; i < registrations.length; i++) {
              promises.push(registrations[i].unregister());
            }
            if ('caches' in window) {
              promises.push(caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(key) {
                  return caches.delete(key);
                }));
              }));
            }
            Promise.all(promises).then(function() {
              console.log('Purge complete. Performing hot reload...');
              window.location.reload();
            }).catch(function(err) {
              console.error('Purge error:', err);
              window.location.reload();
            });
          }
        });
      }

      // Standby fallback: reload of the page if physical assets (CSS/JS) fail to load
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Physical asset failed to load. Performing fallback reload:', e.target.src || e.target.href);
          try {
            var lastReload = sessionStorage.getItem('last_err_reload');
            var now = Date.now();
            if (!lastReload || (now - parseInt(lastReload, 10)) > 8000) {
              sessionStorage.setItem('last_err_reload', String(now));
              window.location.reload();
            }
          } catch(err) {
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
