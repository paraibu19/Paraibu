<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background health-blue gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dabf7" />
      <stop offset="100%" stop-color="#15aabf" />
    </linearGradient>
    
    <!-- Drop shadow for the clock badge layer -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#043249" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base background card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Subtle shadow under the medicine bottle base -->
  <ellipse cx="238" cy="415" rx="85" ry="12" fill="#043249" opacity="0.25"/>

  <!-- BOTTLE CAP & NECK -->
  <!-- Screw Cap -->
  <rect x="188" y="90" width="100" height="42" rx="8" fill="white"/>
  <!-- Ridges on Cap -->
  <line x1="210" y1="98" x2="210" y2="124" stroke="#4dabf7" stroke-width="4" stroke-linecap="round"/>
  <line x1="224" y1="98" x2="224" y2="124" stroke="#4dabf7" stroke-width="4" stroke-linecap="round"/>
  <line x1="238" y1="98" x2="238" y2="124" stroke="#4dabf7" stroke-width="4" stroke-linecap="round"/>
  <line x1="252" y1="98" x2="252" y2="124" stroke="#4dabf7" stroke-width="4" stroke-linecap="round"/>
  <line x1="266" y1="98" x2="266" y2="124" stroke="#4dabf7" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Cap Collar / Collar Ring -->
  <rect x="204" y="132" width="68" height="12" rx="3" fill="white"/>

  <!-- Bottle Neck -->
  <rect x="213" y="144" width="50" height="36" fill="white" fill-opacity="0.25" stroke="white" stroke-width="8" stroke-linejoin="round"/>

  <!-- LIQUID (Syrup) INSIDE BOTTLE -->
  <!-- Wavy fluid surface and syrup body (layered behind the glass outer stroke) -->
  <path d="M 168 280 Q 203 268, 238 280 T 308 280 L 308 375 C 308 388, 298 391, 278 391 L 198 391 C 178 391, 168 388, 168 375 Z" fill="#ff6b6b" fill-opacity="0.95"/>
  
  <!-- BOTTLE BODY (Outer Glass Outlines) -->
  <path d="M 213 180 C 192 180, 158 195, 158 220 L 158 375 C 158 395, 178 400, 198 400 L 278 400 C 298 400, 318 395, 318 375 L 318 220 C 318 195, 284 180, 263 180 Z" stroke="white" stroke-width="14" fill="white" fill-opacity="0.15" stroke-linejoin="round"/>

  <!-- MEASUREMENT TICKS (on left body of bottle) -->
  <line x1="158" y1="225" x2="176" y2="225" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="158" y1="255" x2="176" y2="255" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="158" y1="285" x2="176" y2="285" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="158" y1="315" x2="176" y2="315" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="158" y1="345" x2="176" y2="345" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- MEDICAL LABEL ON BOTTLE -->
  <rect x="180" y="195" width="116" height="52" rx="8" fill="white"/>
  <!-- Droplet on the label representation -->
  <path d="M 238 206 C 238 206, 226 220, 226 228 C 226 234, 231 240, 238 240 C 245 240, 250 234, 250 228 C 250 220, 238 206, 238 206 Z" fill="#228be6"/>

  <!-- OVERLAPPING CLOCK BADGE (Bottom-Right, floated with elegant drop shadow) -->
  <circle cx="340" cy="320" r="82" fill="white" stroke="#e3fafc" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Inner clock rim -->
  <circle cx="340" cy="320" r="70" fill="none" stroke="#228be6" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Hour Indicators (12, 3, 6, 9) -->
  <circle cx="340" cy="265" r="5" fill="#1c7ed6"/>
  <circle cx="395" cy="320" r="5" fill="#1c7ed6"/>
  <circle cx="340" cy="375" r="5" fill="#1c7ed6"/>
  <circle cx="285" cy="320" r="5" fill="#1c7ed6"/>
  
  <!-- Clock hands (pointing to safe schedule times or typical dosage reminder) -->
  <!-- Hour hand pointing to 10 -->
  <line x1="340" y1="320" x2="312" y2="292" stroke="#1c7ed6" stroke-width="10" stroke-linecap="round"/>
  <!-- Minute hand pointing to 2 -->
  <line x1="340" y1="320" x2="378" y2="298" stroke="#15aabf" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Pin in center of clock -->
  <circle cx="340" cy="320" r="9" fill="#1c7ed6"/>
</svg>
